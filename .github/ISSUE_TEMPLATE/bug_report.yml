name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time. **Never paste tokens, API keys or customer conversations here.**"
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [Hosted (triagefox.com), Self-hosted, Not sure]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: Version (self-hosted) or date it happened (hosted)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (remove anything private)
      render: shell
