packages:
  - apps/*
  - packages/*
  - spikes
onlyBuiltDependencies:
  - esbuild
  - sharp
  - libsodium
# Known-vulnerable transitive build tools, pinned to patched versions (pnpm audit).
overrides:
  "esbuild@<0.25.0": ">=0.25.0"
  "minimatch@<11.0.1": ">=11.0.1"
  "glob@>=9.0.0 <14.0.2": ">=14.0.2"
